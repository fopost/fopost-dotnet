name: Release

# Tag the commit as v<version> matching <Version> in src/FoPost/FoPost.csproj,
# e.g. v0.1.0. Publishing authenticates over OIDC against the
# trusted publishing policy on nuget.org, so no API key is stored.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates publishing behind a dedicated environment, so commit access alone
    # does not grant the ability to push a release to NuGet.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/FoPost.Sdk
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/FoPost/FoPost.csproj | head -1)
          [ "$VERSION" = "$TAG" ] || { echo "::error::FoPost.csproj is $VERSION but tag is $TAG"; exit 1; }

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build

      - run: dotnet pack src/FoPost/FoPost.csproj --configuration Release --no-build --output artifacts

      # nuget.org issues a key that is valid for one hour, so ask for it
      # immediately before the push rather than earlier in the job.
      - name: Exchange the OIDC token for a short-lived NuGet key
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: fopost

      - name: Publish to NuGet
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
